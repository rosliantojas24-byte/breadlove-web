<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Bread Love</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prata&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- cart.css first, menu.css second -->
  <link rel="stylesheet" href="cart.css" />
  <link rel="stylesheet" href="menu.css" />
</head>

<body>

  <!-- ============ BANNER ============ -->
  <header class="banner">
    <a class="back" href="index.html">← Home</a>

    <div class="banner-mark">
      <!-- Swap this in when you're ready:
           <img src="breadlove-logo.png" alt="Bread Love" class="banner-logo" /> -->
      <h1>Bread Love</h1>
      <p>Ruko Modern Walk MW 67, Moderland — Tangerang</p>
    </div>
  </header>

  <!-- ============ MENU BODY ============ -->
  <main class="menu-layout">
    <nav class="tabs" id="tabList" aria-label="Menu categories"></nav>
    <div class="sections" id="sectionList"></div>
  </main>

  <!-- ============ BOTTOM CART BAR ============ -->
  <div class="cart-bar">
    <button class="cart-toggle" data-cart-toggle>
      <span class="bar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6" />
          <circle cx="10" cy="20" r="1.4" />
          <circle cx="18" cy="20" r="1.4" />
        </svg>
        <span class="cart-badge" data-cart-count>0</span>
      </span>
      <span class="cart-label">
        <span class="cart-label-top">Your order</span>
        <span class="cart-label-total" data-cart-total>Rp 0</span>
      </span>
    </button>

    <button class="checkout" data-cart-checkout>Check out</button>
  </div>

  <!-- cart.js MUST load before menu.js -->
  <script src="cart.js"></script>
  <script src="menu.js"></script>
</body>
</html>
